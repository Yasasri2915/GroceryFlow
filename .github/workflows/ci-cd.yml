name: CI-CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Parent POM
        run: |
          mvn install -N -f groceryflow-parent/pom.xml

      - name: Run Payment Service Unit Tests
        run: |
          mvn clean test -f payment-service/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payment Service Docker Image
        run: |
          cd payment-service
          docker build -t groceryflow-payment:${{ github.sha }} .
